<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine ❤️</title>
  <style>
    body {
      background-color: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1;
    }

    h1 {
      color: red;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      margin: 15px;
      padding: 10px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .yes {
      background-color: red;
      color: white;
    }

    .no {
      background-color: gray;
      color: white;
      position: fixed; /* FIXED to viewport, not card */
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Baby G 💖</h1>
    <h2>Will you be my Valentine?</h2>
    <p>From your favourite Young Warlock / Valentine 💕</p>

    <button class="yes" onclick="yesClicked()">Yes</button>
    <button class="no" onmouseover="moveButton()">No</button>
  </div>

  <script>
    const noButton = document.querySelector(".no");

    function moveButton() {
      const padding = 20; // keep button fully visible
      const x = Math.random() * (window.innerWidth - noButton.offsetWidth - padding*2) + padding;
      const y = Math.random() * (window.innerHeight - noButton.offsetHeight - padding*2) + padding;

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    function yesClicked() {
      alert("YAY!!! I love you baby and I will try harder to always be the man for you. Forgive me for my stupidity most times. You are the girl for me. 💖💖💖");
    }
  </script>

</body>
</html>
