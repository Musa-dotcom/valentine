<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine ❤️</title>
  <style>
    body {
      background-color: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    h1 {
      color: red;
    }

    button {
      margin: 15px;
      padding: 10px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .yes {
      background-color: red;
      color: white;
    }

    .no {
      background-color: gray;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Baby G 💖</h1>
    <h2>Will you be my Valentine?</h2>

    <button class="yes" onclick="yesClicked()">Yes</button>
    <button class="no" onmouseover="moveButton()">No</button>
  </div>

  <script>
    function moveButton() {
      const button = document.querySelector(".no");

      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);

      button.style.left = x + "px";
      button.style.top = y + "px";
    }

    function yesClicked() {
      alert("YAY!!! I love you so much Rumbie 💖💖💖");
    }
  </script>

</body>
</html>
